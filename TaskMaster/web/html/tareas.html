<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>TaskMaster - Gestión de tareas</title>

    <link rel="stylesheet" href="../css/tareas.css">
</head>

<body>

    <header>

        <h1>TaskMaster</h1>

        <nav>
            <a href="../index.html">Inicio</a>
            <a href="../html/tareas.html">Tareas</a>
            <a href="../html/contacto.html">Contacto</a>
        </nav>

    </header>

    <main>

        <!-- LISTADO DE TAREAS -->

        <section class="listado-tareas">

            <h2>Listado de tareas</h2>

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Estado</th>
                        <th>Categoría</th>
                        <th>Usuario</th>
                        <th>Acciones</th>
                    </tr>

                </thead>

                <tbody>

                    <tr>
                        <td>1</td>
                        <td>Preparar práctica</td>
                        <td>Pendiente</td>
                        <td>Estudios</td>
                        <td>Sergio</td>

                        <td>
                            <button class="btnEliminar">
                                Eliminar
                            </button>
                        </td>
                    </tr>

                    <tr>
                        <td>2</td>
                        <td>Actualizar documentación</td>
                        <td>En progreso</td>
                        <td>Personal</td>
                        <td>Sergio</td>

                        <td>
                            <button class="btnEliminar">
                                Eliminar
                            </button>
                        </td>
                    </tr>

                </tbody>

            </table>

        </section>

        <!-- FORMULARIO CREAR TAREA -->

        <section class="crear-tarea">

            <h2>Crear tarea</h2>

            <form>

                <label>Título</label>

                <input type="text" id="titulo" placeholder="Introduce el título" required>

                <label>Descripción</label>

                <textarea id="descripcion" placeholder="Describe la tarea" required></textarea>

                <label>Estado</label>

                <select id="estado" required>
                    <option>Pendiente</option>
                    <option>En progreso</option>
                    <option>Completada</option>
                </select>

                <label>Categoría</label>

                <select id="categoria" required>
                    <option>Personal</option>
                    <option>Estudios</option>
                </select>

                <label>Observaciones</label>

                <textarea id="observaciones" placeholder="Observaciones adicionales"></textarea>

                <button type="button" id="btnCrear">
                    Crear tarea
                </button>

            </form>

        </section>

        <!-- FORMULARIO EDITAR TAREA -->

        <section class="editar-tarea">

            <h2>Editar tarea</h2>

            <form>

                <label>ID tarea</label>

                <input type="number" id="editarID" placeholder="ID de la tarea" required>

                <label>Nuevo título</label>

                <input type="text" id="editarTitulo" placeholder="Nuevo título">

                <label>Nueva descripción</label>

                <textarea id="editarDescripcion" placeholder="Nueva descripción"></textarea>

                <button type="button" id="btnEditar">
                    Guardar cambios
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>© 2026 TaskMaster - Sergio Martínez</p>
    </footer>

    <script src="../js/script.js"></script>

</body>

</html>
